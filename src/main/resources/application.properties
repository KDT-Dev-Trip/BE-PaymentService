# Default Profile Configuration
# Use 'local' profile for local development with MySQL
# Use 'dev' profile for Docker development with PostgreSQL  
# Use 'production' profile for production deployment

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common configuration that applies to all profiles
spring.application.name=payment-service

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.security.enabled=false
management.endpoint.info.enabled=true
management.metrics.export.prometheus.enabled=true

# Disable default Spring Security if accidentally included
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ============================================================================
# 토스 결제 API 성능 최적화
# ============================================================================

# HTTP Client 최적화
toss.api.connection-timeout=8000
toss.api.read-timeout=45000
toss.api.max-connections=80
toss.api.max-per-route=30
toss.api.connection-pool-ttl=60000
toss.api.keep-alive=true

# 결제 처리 최적화
payment.timeout=60s
payment.retry.max-attempts=3
payment.retry.delay=2000
payment.validation.cache=true
payment.queue.capacity=200

# 데이터베이스 최적화 (결제용)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=2000

# ============================================================================
# 모니터링 메트릭 추가 (결제 서비스용)
# ============================================================================

# 결제 관련 메트릭
management.metrics.enable.payment.processing=true
management.metrics.enable.payment.success-rate=true
management.metrics.enable.toss.api.response-time=true
