# Kubernetes Environment Configuration
spring.application.name=payment-service
server.port=8081

# Eureka Client Configuration (Disabled)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# MySQL Database Configuration - Kubernetes MySQL Service
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-service:3306/devtrip-payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# TossPayments Configuration
toss.payments.secret.key=${TOSS_PAYMENTS_SECRET_KEY:test_sk_24xLea5zVAkeX7pqXzgY8QAMYNwW}
toss.payments.client.key=${TOSS_PAYMENTS_CLIENT_KEY:test_ck_yZqmkKeP8gJoxxW7gzz4rbQRxB9l}
toss.payments.api.url=https://api.tosspayments.com

# Redis Configuration - Kubernetes Redis Service
spring.redis.enabled=true
spring.redis.host=redis-service
spring.redis.port=6379
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.database=0

# Kafka Configuration - Kubernetes Kafka Service
spring.kafka.bootstrap-servers=kafka-service:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=payment-service-group-v2
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=MissionCreatedEvent:ac.su.kdt.bepaymentservice.kafka.ExternalEvent,MissionCompletedEvent:ac.su.kdt.bepaymentservice.kafka.ExternalEvent

# 표준화된 카프카 토픽 설정
kafka.topics.auth-events=auth-events
kafka.topics.user-events=user-events
kafka.topics.mission-events=mission-events
kafka.topics.payment-events=payment-events
kafka.topics.evaluation-events=evaluation-events
# Legacy - 단계적 제거 예정
kafka.topics.subscription-events=subscription-events

# 기존 호환성 유지 (점진적 마이그레이션)
kafka.topic.payment-events=payment-events
kafka.topic.subscription-events=subscription-events
kafka.topic.mission-events=mission-events
kafka.topic.user-events=user-events
kafka.topic.evaluation-events=evaluation-events
kafka.topic.auth-events=auth-events

# Logging
logging.level.ac.su.kdt.bepaymentservice=DEBUG
logging.level.org.springframework.kafka=INFO

# Actuator & Monitoring (표준 설정)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.info.enabled=true
management.metrics.export.prometheus.enabled=true
management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.kafka.enabled=false
management.health.redis.enabled=false

# Application Info
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=DevTrip Payment Service - Payments & Subscriptions

# External Service URLs - Kubernetes Services
external.services.user.url=http://user-management-service:8082
external.services.mission.url=http://mission-management-service:8083
external.services.auth.url=http://authentication-service:8080

# Disable default Spring Security if accidentally included
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration