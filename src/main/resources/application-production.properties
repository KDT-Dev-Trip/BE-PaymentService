# Production Environment Configuration
spring.application.name=payment-service
server.port=8081

# Eureka Client Configuration (Disabled)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# MySQL Database Configuration (for production)
spring.datasource.url=${DB_URL:jdbc:mysql://devtrip-mysql:3306/devtrip-payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:devtrip_user}
spring.datasource.password=${DB_PASSWORD:devtrip_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# TossPayments Configuration
toss.payments.secret.key=${TOSS_PAYMENTS_SECRET_KEY}
toss.payments.client.key=${TOSS_PAYMENTS_CLIENT_KEY}
toss.payments.api.url=https://api.tosspayments.com

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=payment-service-group-v2
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=MissionCreatedEvent:ac.su.kdt.bepaymentservice.kafka.ExternalEvent,MissionCompletedEvent:ac.su.kdt.bepaymentservice.kafka.ExternalEvent

# Kafka Topics
kafka.topic.payment-events=payment-events
kafka.topic.subscription-events=subscription-events
kafka.topic.user-events=user-events
kafka.topic.mission-events=mission-events

# Logging (production level)
logging.level.root=INFO
logging.level.ac.su.kdt.bepaymentservice=INFO
logging.level.org.springframework.kafka=WARN

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Health check configuration
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,kafka