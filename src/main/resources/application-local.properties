# Local Development Environment Configuration (MySQL)
spring.application.name=payment-service
server.port=8081

# Eureka Client Configuration (Disabled)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# MySQL Database Configuration (for local development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devtrip-payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# TossPayments Configuration
toss.payments.secret.key=${TOSS_PAYMENTS_SECRET_KEY:test_sk_24xLea5zVAkeX7pqXzgY8QAMYNwW}
toss.payments.client.key=${TOSS_PAYMENTS_CLIENT_KEY:test_ck_yZqmkKeP8gJoxxW7gzz4rbQRxB9l}
toss.payments.api.url=https://api.tosspayments.com

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=payment-service-group-v2
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=MissionCreatedEvent:ac.su.kdt.bepaymentservice.kafka.ExternalEvent,MissionCompletedEvent:ac.su.kdt.bepaymentservice.kafka.ExternalEvent

# \ud45c\uc900\ud654\ub41c \uce74\ud504\uce74 \ud1a0\ud53d \uc124\uc815
kafka.topics.auth-events=auth-events
kafka.topics.user-events=user-events
kafka.topics.mission-events=mission-events
kafka.topics.payment-events=payment-events
kafka.topics.evaluation-events=evaluation-events
# Legacy - \ub2e8\uacc4\uc801 \uc81c\uac70 \uc608\uc815
kafka.topics.subscription-events=subscription-events

# \uae30\uc874 \ud638\ud658\uc131 \uc720\uc9c0 (\uc810\uc9c4\uc801 \ub9c8\uc774\uadf8\ub808\uc774\uc158)
kafka.topic.payment-events=payment-events
kafka.topic.subscription-events=subscription-events
kafka.topic.mission-events=mission-events
kafka.topic.user-events=user-events
kafka.topic.evaluation-events=evaluation-events
kafka.topic.auth-events=auth-events

# Logging
logging.level.ac.su.kdt.bepaymentservice=DEBUG
logging.level.org.springframework.kafka=INFO

# Actuator & Monitoring (표준 설정)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.info.enabled=true
management.metrics.export.prometheus.enabled=true
management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.kafka.enabled=false
management.health.redis.enabled=false

# Application Info
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=DevTrip Payment Service - Payments & Subscriptions

