# Default Profile Configuration
# Use 'local' profile for local development with MySQL
# Use 'dev' profile for Docker development with PostgreSQL  
# Use 'production' profile for production deployment

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common configuration that applies to all profiles
spring.application.name=payment-service

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.security.enabled=false
management.endpoint.info.enabled=true
management.metrics.export.prometheus.enabled=true

# Disable default Spring Security if accidentally included
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
